x-database-env: &database-env
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-nakama}
  DB_USER: ${DB_USER:-nakama}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the Dokploy Environment tab}
  DB_SSL_MODE: ${DB_SSL_MODE:-}
  DB_SSL_ROOT_CERT: ${DB_SSL_ROOT_CERT:-}
  DB_URL: ${DB_URL:-}
  DB_WAIT_TIMEOUT_SECONDS: ${DB_WAIT_TIMEOUT_SECONDS:-120}

services:

  postgres:
    image: ${NEXUS_DOCKER_HOST:-docker.arvancloud.ir}/library/postgres:16.8-alpine@sha256:3b057e1c2c6dfee60a30950096f3fab33be141dbb0fdd7af3d477083de94166c

    restart: unless-stopped

    mem_limit: 2g
    memswap_limit: 2g
    cpus: "1"

    logging:
      driver: json-file
      options:
        max-size: "150m"
        max-file: "3"

    environment:
      POSTGRES_DB: ${DB_NAME:-nakama}
      POSTGRES_USER: ${DB_USER:-nakama}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the Dokploy Environment tab}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 120s


  cockroachdb:
    profiles: ["cockroach-import"]
    image: ${NEXUS_DOCKER_HOST:-docker.arvancloud.ir}/cockroachdb/cockroach:v24.1.34@sha256:0f7c4db12f7a9eda952682a4fe33ef896a5254ef8b00dc83e580d8f37257900f

    command:
      - start-single-node
      - --insecure
      - --store=attrs=ssd,path=/var/lib/cockroach/

    restart: unless-stopped

    mem_limit: 2g
    memswap_limit: 2g
    cpus: "1"

    logging:
      driver: json-file
      options:
        max-size: "150m"
        max-file: "3"

    volumes:
      - data:/var/lib/cockroach

    expose:
      - "8080"
      - "26257"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/health?ready=1"
        ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 120s


  nakama-migrate:
    build:
      context: .
      dockerfile: build/Dockerfile.local
      args:
        NEXUS_DOCKER_HOST: ${NEXUS_DOCKER_HOST:-docker.arvancloud.ir}
    image: nakama-farsi:local

    entrypoint: ["/nakama/nakama-db.sh", "migrate"]

    environment:
      <<: *database-env
      DB_MIGRATIONS_ENABLED: ${DB_MIGRATIONS_ENABLED:-true}
      DB_IMPORT_FROM_COCKROACH: ${DB_IMPORT_FROM_COCKROACH:-true}
      COCKROACH_IMPORT_URL: ${COCKROACH_IMPORT_URL:-postgresql://root@cockroachdb:26257/nakama?sslmode=disable}

    restart: "no"

    logging:
      driver: json-file
      options:
        max-size: "150m"
        max-file: "3"

    depends_on:
      postgres:
        condition: service_healthy


  nakama:
    build:
      context: .
      dockerfile: build/Dockerfile.local
      args:
        NEXUS_DOCKER_HOST: ${NEXUS_DOCKER_HOST:-docker.arvancloud.ir}
    image: nakama-farsi:local

    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
        NODE_NAME=nakama1;
        if [ "$$NAKAMA_CLUSTER_ENABLED" = "true" ]; then NODE_NAME="$${NAKAMA_NODE_NAME:-$$(hostname | cut -c1-16)}"; fi;
        exec /nakama/nakama-db.sh server
        --name "$$NODE_NAME"
        --cluster.enabled="$$NAKAMA_CLUSTER_ENABLED"
        --cluster.redis_address "$$NAKAMA_CLUSTER_REDIS_ADDRESS"
        --cluster.redis_password "$$NAKAMA_CLUSTER_REDIS_PASSWORD"
        --cluster.port 7353
        --cluster.advertise_address "$${NAKAMA_CLUSTER_ADVERTISE_ADDRESS:-$$(hostname -i | cut -d' ' -f1)}"
        --cluster.secret "$$NAKAMA_CLUSTER_SECRET"
        --cluster.matchmaker_shards "$$NAKAMA_CLUSTER_MATCHMAKER_SHARDS"
        --cluster.matchmaker_shard_property "$$NAKAMA_CLUSTER_MATCHMAKER_SHARD_PROPERTY"
        --logger.level DEBUG
        --session.token_expiry_sec 7200
        --metrics.prometheus_port 9100
        --socket.server_key "$$NAKAMA_SERVER_KEY"
        --session.encryption_key "$$NAKAMA_SESSION_ENCRYPTION_KEY"
        --runtime.http_key "$$NAKAMA_RUNTIME_HTTP_KEY"
        --console.username "$$NAKAMA_CONSOLE_USERNAME"
        --console.password "$$NAKAMA_CONSOLE_PASSWORD"
        --console.signing_key "$$NAKAMA_CONSOLE_SIGNING_KEY"
        --runtime.env "ECONOMY_SECRET_KEY=$$ECONOMY_SECRET_KEY"
        --runtime.env "ECONOMY_PUBLIC_BASE_URL=$$ECONOMY_PUBLIC_BASE_URL"
        --runtime.env "ECONOMY_WEB_REDIRECT_URL=$$ECONOMY_WEB_REDIRECT_URL"
        --runtime.env "ECONOMY_DEEP_LINK=$$ECONOMY_DEEP_LINK"
        --runtime.env "ECONOMY_UPLOAD_DIR=/nakama/uploads"
        --runtime.env "STORAGE_DRIVER=$$STORAGE_DRIVER"
        --runtime.env "STORAGE_S3_ENDPOINT=$$STORAGE_S3_ENDPOINT"
        --runtime.env "STORAGE_S3_BUCKET=$$STORAGE_S3_BUCKET"
        --runtime.env "STORAGE_S3_REGION=$$STORAGE_S3_REGION"
        --runtime.env "STORAGE_S3_ACCESS_KEY=$$STORAGE_S3_ACCESS_KEY"
        --runtime.env "STORAGE_S3_SECRET_KEY=$$STORAGE_S3_SECRET_KEY"
        --runtime.env "STORAGE_S3_PATH_STYLE=$$STORAGE_S3_PATH_STYLE"
        --runtime.env "STORAGE_S3_PUBLIC_BASE_URL=$$STORAGE_S3_PUBLIC_BASE_URL"
        --runtime.env "STORAGE_S3_PREFIX=$$STORAGE_S3_PREFIX"
        --runtime.env "STARGAME_SERVER_KEY=$$NAKAMA_SERVER_KEY"
        --runtime.env "STARGAME_SEED=$$STARGAME_SEED"

    restart: unless-stopped

    mem_limit: 3g
    memswap_limit: 3g
    cpus: "2"

    logging:
      driver: json-file
      options:
        max-size: "150m"
        max-file: "3"

    environment:
      <<: *database-env
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY}
      NAKAMA_SESSION_ENCRYPTION_KEY: ${NAKAMA_SESSION_ENCRYPTION_KEY}
      NAKAMA_RUNTIME_HTTP_KEY: ${NAKAMA_RUNTIME_HTTP_KEY}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY}
      ECONOMY_SECRET_KEY: ${ECONOMY_SECRET_KEY:-${NAKAMA_SESSION_ENCRYPTION_KEY}}
      ECONOMY_PUBLIC_BASE_URL: ${ECONOMY_PUBLIC_BASE_URL:-https://nakama.dastar.dev}
      ECONOMY_WEB_REDIRECT_URL: ${ECONOMY_WEB_REDIRECT_URL:-https://nakama.dastar.dev/stargame/?payment={paymentId}&success={success}}
      ECONOMY_DEEP_LINK: ${ECONOMY_DEEP_LINK:-nakama://payment?success={success}&paymentId={paymentId}}
      HANDOFF_PUBLIC_HOST: ${HANDOFF_PUBLIC_HOST:-}
      HANDOFF_PUBLIC_PORT: ${HANDOFF_PUBLIC_PORT:-}
      HANDOFF_PUBLIC_SSL: ${HANDOFF_PUBLIC_SSL:-}
      STARGAME_SEED: ${STARGAME_SEED:-true}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_PATH_STYLE: ${STORAGE_S3_PATH_STYLE:-true}
      STORAGE_S3_PUBLIC_BASE_URL: ${STORAGE_S3_PUBLIC_BASE_URL:-}
      STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-}
      NAKAMA_CLUSTER_ENABLED: ${NAKAMA_CLUSTER_ENABLED:-false}
      NAKAMA_NODE_NAME: ${NAKAMA_NODE_NAME:-}
      NAKAMA_CLUSTER_REDIS_ADDRESS: ${NAKAMA_CLUSTER_REDIS_ADDRESS:-redis:6379}
      NAKAMA_CLUSTER_REDIS_PASSWORD: ${NAKAMA_CLUSTER_REDIS_PASSWORD:-}
      NAKAMA_CLUSTER_ADVERTISE_ADDRESS: ${NAKAMA_CLUSTER_ADVERTISE_ADDRESS:-}
      NAKAMA_CLUSTER_SECRET: ${NAKAMA_CLUSTER_SECRET:-${NAKAMA_SESSION_ENCRYPTION_KEY}}
      NAKAMA_CLUSTER_MATCHMAKER_SHARDS: ${NAKAMA_CLUSTER_MATCHMAKER_SHARDS:-16}
      NAKAMA_CLUSTER_MATCHMAKER_SHARD_PROPERTY: ${NAKAMA_CLUSTER_MATCHMAKER_SHARD_PROPERTY:-}

    volumes:
      - economy-uploads:/nakama/uploads

    depends_on:
      postgres:
        condition: service_healthy
      nakama-migrate:
        condition: service_completed_successfully

    expose:
      - "7349"
      - "7350"
      - "7351"
      - "7353"
      - "9100"

    healthcheck:
      test:
        [
          "CMD",
          "/nakama/nakama",
          "healthcheck"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    profiles: ["cluster"]
    image: ${NEXUS_DOCKER_HOST:-docker.arvancloud.ir}/library/redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${NAKAMA_CLUSTER_REDIS_MAXMEMORY:-1gb}", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  prometheus:
    image: ${NEXUS_DOCKER_HOST:-docker.arvancloud.ir}/prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06

    restart: unless-stopped

    entrypoint: /bin/sh -c

    command: |
      'sh -s <<EOF
        cat > ./prometheus.yml <<EON
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:

        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: nakama
          metrics_path: /
          static_configs:
            - targets: ["nakama:9100"]
      EON

      prometheus --config.file=./prometheus.yml
      EOF'

    expose:
      - "9090"


volumes:
  postgres-data:
  economy-uploads:
  data:
