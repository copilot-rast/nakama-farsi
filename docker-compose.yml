services:

  cockroachdb:
    image: cockroachdb/cockroach:latest-v24.1

    command:
      - start-single-node
      - --insecure
      - --store=attrs=ssd,path=/var/lib/cockroach/

    restart: unless-stopped

    # Resource limits
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "1"

    # Prevent unbounded Docker logs
    logging:
      driver: json-file
      options:
        max-size: "150m"
        max-file: "3"

    volumes:
      - data:/var/lib/cockroach

    expose:
      - "8080"
      - "26257"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/health?ready=1"
        ]
      interval: 3s
      timeout: 3s
      retries: 5


  nakama:
    # Built from this repository so the Persian (fa-IR) console is included;
    # the official heroiclabs/nakama image ships the upstream English console.
    build:
      context: .
      dockerfile: build/Dockerfile.local
    image: nakama-farsi:local

    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up
        --database.address root@cockroachdb:26257 &&
        exec /nakama/nakama
        --name nakama1
        --database.address root@cockroachdb:26257
        --logger.level DEBUG
        --session.token_expiry_sec 7200
        --metrics.prometheus_port 9100
        --socket.server_key "$NAKAMA_SERVER_KEY"
        --session.encryption_key "$NAKAMA_SESSION_ENCRYPTION_KEY"
        --runtime.http_key "$NAKAMA_RUNTIME_HTTP_KEY"
        --console.username "$NAKAMA_CONSOLE_USERNAME"
        --console.password "$NAKAMA_CONSOLE_PASSWORD"
        --console.signing_key "$NAKAMA_CONSOLE_SIGNING_KEY"

    restart: unless-stopped

    # Resource limits
    mem_limit: 3g
    memswap_limit: 3g
    cpus: "2"

    # Prevent unbounded Docker logs
    logging:
      driver: json-file
      options:
        max-size: "150m"
        max-file: "3"

    environment:
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY}
      NAKAMA_SESSION_ENCRYPTION_KEY: ${NAKAMA_SESSION_ENCRYPTION_KEY}
      NAKAMA_RUNTIME_HTTP_KEY: ${NAKAMA_RUNTIME_HTTP_KEY}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY}

    depends_on:
      cockroachdb:
        condition: service_healthy

    # Internal Docker ports only.
    # Dokploy/Traefik routes:
    #   nakama.dastar.dev         -> 7350
    #   nakama-console.dastar.dev -> 7351
    expose:
      - "7349"
      - "7350"
      - "7351"
      - "9100"

    healthcheck:
      test:
        [
          "CMD",
          "/nakama/nakama",
          "healthcheck"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  prometheus:
    image: prom/prometheus:latest

    restart: unless-stopped

    entrypoint: /bin/sh -c

    command: |
      'sh -s <<EOF
        cat > ./prometheus.yml <<EON
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:

        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: nakama
          metrics_path: /
          static_configs:
            - targets: ["nakama:9100"]
      EON

      prometheus --config.file=./prometheus.yml
      EOF'

    # Prometheus is internal only.
    # Do NOT expose 9090 publicly.
    expose:
      - "9090"


volumes:
  data:
