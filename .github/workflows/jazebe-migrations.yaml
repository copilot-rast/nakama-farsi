name: Jazebe migration and database checks
on:
  pull_request:
    paths:
      - 'integrations/jazebe/**'
      - 'migrate/**'
      - 'scripts/jazebe_route_audit/**'
      - 'build/Dockerfile.local'
      - 'build/nakama-db.sh'
      - 'scripts/nakama-db-test.sh'
      - 'scripts/cockroach-import-test.sh'
      - 'docker-compose.yml'
      - 'docs/integration/jazebe-http-routes.md'
      - 'docs/integration/jazebe-route-parity.json'
      - '.github/workflows/jazebe-migrations.yaml'
  workflow_dispatch:

jobs:
  profile_postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: jazebe_test_disposable
          POSTGRES_PASSWORD: localdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jazebe_test_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate source-linked route inventory
        run: |
          go test -mod=vendor ./scripts/jazebe_route_audit -count=1
          go run -mod=vendor ./scripts/jazebe_route_audit -offline
      - name: Unit and migration policy tests
        run: go test -mod=vendor ./integrations/jazebe/... ./migrate ./scripts/jazebe_route_audit -count=1
      - name: Build Nakama and the Jazebe plugin with matching flags
        run: |
          go build -mod=vendor -trimpath -o "$RUNNER_TEMP/nakama" .
          go build -mod=vendor -trimpath -buildmode=plugin -o "$RUNNER_TEMP/jazebe.so" ./integrations/jazebe/native
      - name: Apply Nakama and Jazebe migrations to disposable PostgreSQL
        run: |
          "$RUNNER_TEMP/nakama" migrate up --database.address postgres:localdb@127.0.0.1:5432/jazebe_test_disposable
          "$RUNNER_TEMP/nakama" migrate up --database.address postgres:localdb@127.0.0.1:5432/jazebe_test_disposable | tee "$RUNNER_TEMP/rerun.log"
          grep -q '"count":0' "$RUNNER_TEMP/rerun.log"
      - name: Report Jazebe schema drift against the committed snapshot
        # The snapshot records the PostgreSQL major it was taken on; this job
        # reports differences for review without failing on catalog text from
        # another major.
        continue-on-error: true
        run: go run -mod=vendor ./scripts/jazebe_schema_check -db postgresql://postgres:localdb@127.0.0.1:5432/jazebe_test_disposable?sslmode=disable
      - name: Exercise every PostgreSQL workflow, sweep, replay and SQL prepare test
        env:
          JAZEBE_DISPOSABLE_TEST_DB_URL: postgresql://postgres:localdb@127.0.0.1:5432/jazebe_test_disposable?sslmode=disable
        run: go test -mod=vendor ./integrations/jazebe/... -run 'Postgres' -count=1 -v
      - name: Refused migrate down keeps the tracker consistent
        run: |
          if "$RUNNER_TEMP/nakama" migrate down --limit 1 --database.address postgres:localdb@127.0.0.1:5432/jazebe_test_disposable; then
            echo "Jazebe migrate down unexpectedly succeeded"; exit 1
          fi
          test "$(PGPASSWORD=localdb psql -h 127.0.0.1 -U postgres -d jazebe_test_disposable -tAc 'select count(*) from migration_info')" = 60

  # The deployment image: the DB_* launcher, the compose wiring, and the
  # one-time import of the legacy CockroachDB data into PostgreSQL
  # (docs/integration/database-configuration.md).
  deployment_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Launcher and docker-compose.yml checks
        run: scripts/nakama-db-test.sh
      - name: Build the deployment image
        run: docker build -f build/Dockerfile.local -t nakama-farsi:local .
      - name: CockroachDB v24.1.33 production state imported into PostgreSQL
        run: scripts/cockroach-import-test.sh nakama-farsi:local
